name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - name: Verify installed CLI contract
        run: |
          chatup --version
          chatup --tree
          chatup --tree-brief
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel CLI contract
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          from pathlib import Path
          import subprocess
          import sys

          venv = Path(os.environ["RUNNER_TEMP"]) / "chatup-wheel"
          subprocess.check_call([sys.executable, "-m", "venv", str(venv)])
          python_bin = venv / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          chatup_bin = venv / ("Scripts/chatup.exe" if os.name == "nt" else "bin/chatup")
          subprocess.check_call([str(python_bin), "-m", "pip", "install", *glob.glob("dist/*.whl")])
          for args in (["--version"], ["--tree"], ["--tree-brief"]):
              subprocess.check_call([str(chatup_bin), *args], cwd=os.environ["RUNNER_TEMP"])
          PY
      - run: mkdocs build --strict
