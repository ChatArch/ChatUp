site_name: ChatUp 文档
site_url: https://arch.gh.wzhecnu.cn/ChatUp/
site_description: ChatArch setup CLI documentation
repo_url: https://github.com/ChatArch/ChatUp
repo_name: ChatArch/ChatUp
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatUp 文档
        - locale: en
          name: English
          build: true
          site_name: ChatUp Documentation
          nav_translations:
            首页: Home
            快速开始: Quick Start
            命令参考: Command Reference
            工作区脚手架: Workspace Scaffold

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true

extra:
  alternate:
    - name: 中文
      link: /ChatUp/
      lang: zh
    - name: English
      link: /ChatUp/en/
      lang: en

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 命令参考: commands.md
  - 工作区脚手架: workspace.md
