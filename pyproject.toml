[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatup"
dynamic = ["version"]
description = "ChatArch setup CLI extracted from ChatTool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0,<9.0",
    "chatstyle>=0.2.0,<0.3.0",
    "chatenv>=0.2.11,<0.3.0",
    "python-dotenv>=1.0,<2.0",
    "colorama",
]
authors = [{name = "rexwzh", email = "1073853456@qq.com"}]
keywords = ["chatup", "chatarch", "setup", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://arch.gh.wzhecnu.cn/ChatUp/"
Source = "https://github.com/ChatArch/ChatUp"
Issues = "https://github.com/ChatArch/ChatUp/issues"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "twine",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<9.7",
    "mkdocs-static-i18n>=1.2,<2.0",
    "mike>=2.0,<3.0",
]

[project.scripts]
chatup = "chatup.cli:main"

[project.entry-points."chatenv.configs"]
cursor-agent = "chatup.config:CursorAgentConfig"
discourse = "chatup.config:DiscourseAdminConfig"
zulip = "chatup.config:ZulipAdminConfig"

[tool.setuptools.dynamic]
version = {attr = "chatup.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"chatup.setup" = [
    "assets/*.sh",
    "assets/hermes/*.sh",
    "workspace/templates/default/zh/*.md",
    "workspace/templates/default/zh/projects/*.md",
    "workspace/templates/default/zh/discussion/*.md",
    "workspace/templates/default/en/*.md",
    "workspace/templates/default/en/projects/*.md",
    "workspace/templates/default/en/discussion/*.md",
]
